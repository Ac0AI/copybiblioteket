<!doctype html><html lang="{{language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title data-i18n="peopleTitle"></title><meta name="description" data-i18n-content="peopleDescription" content=""><link rel="canonical" href="{{canonical}}"><link rel="alternate" hreflang="sv" href="https://sigge.si/people"><link rel="alternate" hreflang="en" href="https://sigge.si/en/people"><meta property="og:title" data-i18n-content="peopleTitle" content=""><meta property="og:description" data-i18n-content="peopleDescription" content=""><meta property="og:url" content="{{canonical}}"><meta property="og:type" content="website"><meta property="og:image" content="https://sigge.si/og.png"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/people.css"><script src="/people.js" type="module"></script></head>
<body><a class="skip" href="#people-search" data-i18n="skip"></a>
{{header}}
<main class="people-main">
  <section class="people-intro">
    <div><p class="eyebrow" data-i18n="peopleEyebrow"></p><h1 class="display" data-i18n="peopleHeading"></h1><p class="lead" data-i18n="peopleIntro"></p><p class="people-number"><span>59</span><span data-i18n="peopleNumber"></span></p></div>
    <div class="portrait-wall" id="portrait-wall" aria-hidden="true"></div>
  </section>
  <div class="people-controls"><label for="people-search" class="people-search"><span class="label-text" data-i18n="peopleSearch"></span><input id="people-search" type="search" data-i18n-placeholder="peoplePlaceholder" autocomplete="off" maxlength="300"></label><label for="people-category" class="people-category"><span class="label-text" data-i18n="area"></span><select id="people-category"><option value="" data-i18n="allAreas"></option></select></label><p id="people-count" role="status" aria-live="polite" data-i18n="loadingPeople"></p></div>
  <div id="people-list" class="people-list" data-i18n-aria-label="people"></div><p id="people-empty" class="people-empty" hidden data-i18n="noPeople"></p>
  <aside class="catalog-note"><h2 data-i18n="useProfiles"></h2><p data-i18n="profileNotice"></p><p data-i18n="profileHow"></p><p><a href="https://brains.ceo/" target="_blank" rel="noopener noreferrer" data-i18n="originalProject"></a></p></aside>
</main>
{{footer}}
</body></html>
