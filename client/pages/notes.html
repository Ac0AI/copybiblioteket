<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<title data-i18n="notesTitle"></title>
<meta name="description" data-i18n-content="notesDescription" content="">
<meta property="og:title" data-i18n-content="notesTitle" content="">
<meta property="og:description" data-i18n-content="notesDescription" content="">
<meta property="og:url" content="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sigge.si/og.png">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="sv" href="https://sigge.si/notes">
<link rel="alternate" hreflang="en" href="https://sigge.si/en/notes">
<link rel="alternate" hreflang="x-default" href="https://sigge.si/notes">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/navigation.css">
<link rel="stylesheet" href="/connect.css">
<script src="/notes.js" type="module"></script>
</head>
<body>
<a class="skip" href="#notes" data-i18n="skip"></a>
{{header}}
<main id="notes" class="connect-main notes-main">
  <div id="account-notice" class="notice" role="status" aria-live="polite" hidden></div>
  <section class="notes-intro">
    <p class="eyebrow">AC0 Field Notes</p>
    <h1 class="display" data-i18n="notesHeading"></h1>
    <p class="lead" data-i18n="notesLead"></p>
  </section>
  <section class="account-card notes-card">
    <form id="email-form">
      <h2 data-i18n="notesEmailHeading"></h2>
      <label for="account-email-input" data-i18n="emailLabel"></label>
      <input id="account-email-input" type="email" name="email" required autocomplete="email" maxlength="254" data-i18n-placeholder="emailPlaceholder" placeholder="">
      <button id="send-code" class="button primary large full" data-i18n="sendCode"></button>
    </form>
    <form id="code-form" hidden>
      <h2 data-i18n="notesCodeHeading"></h2>
      <p id="code-email"></p>
      <label for="code" data-i18n="codeLabel"></label>
      <input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code" aria-describedby="code-help">
      <p id="code-help" class="connect-small" data-i18n="codeHelp"></p>
      <button id="verify-code" class="button primary large full" data-i18n="notesConfirm"></button>
      <button id="change-email" class="text-button" type="button" data-i18n="changeEmail"></button>
    </form>
    <div id="signed-in-join" hidden>
      <h2 data-i18n="notesSignedInHeading"></h2>
      <p id="signed-in-email"></p>
      <button id="join" class="button primary large full" data-i18n="notesJoin"></button>
    </div>
    <div id="done" hidden>
      <p class="card-step is-done">✓</p>
      <h2 data-i18n="notesDone"></h2>
      <p data-i18n="notesDoneDetail"></p>
      <p><a class="button outlined" data-route="/" data-i18n="notesBack"></a></p>
    </div>
    <div class="account-privacy connect-small">
      <p data-i18n="notesAccountNote"></p>
      <p><a data-route="/privacy" data-i18n="privacyFull"></a></p>
    </div>
  </section>
</main>
{{footer}}
</body>
</html>
