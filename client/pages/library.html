<!doctype html><html lang="{{language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title data-i18n="libraryTitle"></title><meta name="description" data-i18n-content="libraryDescription" content=""><link rel="canonical" href="{{canonical}}"><link rel="alternate" hreflang="sv" href="https://sigge.si/library"><link rel="alternate" hreflang="en" href="https://sigge.si/en/library"><meta property="og:title" data-i18n-content="libraryTitle" content=""><meta property="og:description" data-i18n-content="libraryDescription" content=""><meta property="og:url" content="{{canonical}}"><meta property="og:type" content="website"><meta property="og:image" content="https://sigge.si/og.png"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/library.css"><script src="/library.js" type="module"></script></head>
<body><a class="skip" href="#workspace" data-i18n="skip"></a>
{{header}}
<main>
  <section class="search-area" aria-labelledby="main-heading">
    <div class="intro"><p class="eyebrow" data-i18n="libraryEyebrow"></p><h1 id="main-heading" class="display" data-i18n="libraryHeading"></h1><p class="lead" data-i18n="libraryIntro"></p></div>
    <div class="search-tools">
      <form id="search-form" role="search"><label class="sr-only" for="query" data-i18n="searchLabel"></label><div class="search-field"><input id="query" name="query" type="search" maxlength="500" data-i18n-placeholder="searchPlaceholder" autocomplete="off"><button class="button primary" type="submit" data-i18n="search"></button></div>
        <fieldset class="scope"><legend class="sr-only" data-i18n="searchScope"></legend><label><input type="radio" name="scope" value="frameworks" checked> <span data-i18n="frameworks"></span></label><label><input type="radio" name="scope" value="sources"> <span data-i18n="sourceScope"></span></label><label id="person-label" hidden><span data-i18n="author"></span><select id="person"><option value="" data-i18n="allPeople"></option></select></label></fieldset>
      </form>
      <div class="suggestions" data-i18n-aria-label="searchSuggestions"><button type="button" class="chip" data-query="valueQuery" data-i18n="valueSuggestion"></button><button type="button" class="chip" data-query="trustQuery" data-i18n="trustSuggestion"></button><button type="button" class="chip" data-query="voiceQuery" data-i18n="voiceSuggestion"></button><button type="button" class="chip" data-query="headlineQuery" data-i18n="headlineSuggestion"></button></div>
    </div>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section class="workspace" id="workspace" data-i18n-aria-label="frameworks">
    <aside class="library-nav" data-i18n-aria-label="allFrameworks"><div class="library-heading"><h2 id="list-heading" data-i18n="allFrameworks"></h2><button type="button" class="text-button" id="reset" data-i18n="showAll"></button></div><div id="framework-list"></div></aside>
    <article id="detail" class="detail" data-i18n-aria-label="chosenFramework" tabindex="-1"><p data-i18n="loading"></p></article>
  </section>
</main>
{{footer}}
</body></html>
