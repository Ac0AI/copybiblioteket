<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f4ee">
  <title data-i18n="homeTitle"></title><meta name="description" data-i18n-content="homeDescription" content="">
  <link rel="canonical" href="{{canonical}}"><link rel="alternate" hreflang="sv" href="https://sigge.si/"><link rel="alternate" hreflang="en" href="https://sigge.si/en/"><link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta property="og:title" data-i18n-content="homeTitle" content=""><meta property="og:description" data-i18n-content="homeDescription" content=""><meta property="og:url" content="{{canonical}}"><meta property="og:type" content="website"><meta property="og:image" content="https://sigge.si/og.png"><meta name="twitter:card" content="summary_large_image"><meta property="og:video" data-i18n-content="connectVideo" content=""><meta property="og:video:type" content="video/mp4">
  <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/film-connect.css"><link rel="stylesheet" href="/studio.css"><script src="/studio-app.js" type="module"></script>
</head>
<body>
<a class="skip" href="#workshop" data-i18n="skip"></a>
{{header}}
<main>
  <section class="hero">
    <div class="hero-copy">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 class="display"><span data-i18n="heroTitleA"></span> <em data-i18n="heroTitleB"></em></h1>
      <p class="lead" data-i18n="intro"></p>
      <div class="hero-actions"><a class="button primary large" data-route="/connect" data-i18n="heroConnect"></a><a class="button outlined large" href="#workshop" data-i18n="heroTry"></a></div>
      <ul class="hero-facts"><li data-i18n="factFrameworks"></li><li data-i18n="factPeople"></li><li data-i18n="factLanguages"></li><li data-i18n="factFree"></li></ul>
    </div>
    {{filmConnect}}
  </section>

  <section class="workshop" id="workshop" aria-labelledby="workshop-heading">
    <div class="section-intro"><div><p class="eyebrow" data-i18n="workshopEyebrow"></p><h2 id="workshop-heading" class="section-title" data-i18n="workshopHeading"></h2></div><p data-i18n="workshopIntro"></p></div>
    <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
    <div class="studio-grid">
      <aside class="brief-panel">
        <div class="section-heading"><h3><span data-i18n="brief"></span></h3><div class="heading-actions"><button id="load-example" class="text-button" type="button" data-i18n="exampleButton"></button><button id="new-document" class="text-button" type="button" data-i18n="startOver"></button></div></div>
        <form id="brief">
          <label for="task"><span class="label-text" data-i18n="taskLabel"></span> <span data-i18n="required"></span></label><textarea id="task" name="task" rows="3" required minlength="8" maxlength="4000" data-i18n-placeholder="taskPlaceholder"></textarea>
          <label for="audience"><span class="label-text" data-i18n="audienceLabel"></span> <span data-i18n="required"></span></label><textarea id="audience" name="audience" rows="2" required minlength="3" maxlength="1000" data-i18n-placeholder="audiencePlaceholder"></textarea>
          <label for="facts" data-i18n="factsLabel"></label><p class="field-help" id="facts-help" data-i18n="factsHelp"></p><textarea id="facts" name="facts" rows="3" maxlength="5000" aria-describedby="facts-help" data-i18n-placeholder="factsPlaceholder"></textarea>
          <details id="more-settings" class="brief-details"><summary><span class="summary-text"><span data-i18n="moreSettings"></span><small data-i18n="settingsHint"></small></span></summary>
            <label for="language" data-i18n="outputLanguage"></label><select id="language" name="language"><option value="sv" lang="sv">Svenska</option><option value="en" lang="en">English</option></select><p class="field-help" data-i18n="outputHelp"></p>
            <div class="field-row"><label><span class="label-text" data-i18n="format"></span><select id="channel" name="channel"><option value="webb" data-i18n="web"></option><option value="mejl" data-i18n="email"></option><option value="annons" data-i18n="ad"></option><option value="linkedin">LinkedIn</option><option value="produkt" data-i18n="product"></option></select></label><label><span class="label-text" data-i18n="length"></span><select id="length" name="length"><option value="kort" data-i18n="short"></option><option value="normal" selected data-i18n="normal"></option><option value="lång" data-i18n="long"></option></select></label></div>
            <label for="tone" data-i18n="tone"></label><input id="tone" name="tone" maxlength="600" data-i18n-placeholder="tonePlaceholder">
            <label for="voice"><span class="label-text" data-i18n="voice"></span> <span data-i18n="optional"></span></label><textarea id="voice" name="voice" rows="3" maxlength="3000" data-i18n-placeholder="voicePlaceholder"></textarea>
            <label for="mustKeep"><span class="label-text" data-i18n="mustKeep"></span> <span data-i18n="onePerLine"></span></label><textarea id="mustKeep" name="mustKeep" rows="2" maxlength="1500" data-i18n-placeholder="mustKeepPlaceholder"></textarea>
            <label for="perspective" data-i18n="perspective"></label><select id="perspective" name="perspective" disabled><option value="" data-i18n="automatic"></option></select><p class="field-help"><span data-i18n="perspectiveHelp"></span> <a data-route="/people" data-i18n="explorePeople"></a></p>
          </details>
          <p id="selected-perspective" class="small-note" hidden></p>
          <button id="write-button" class="button primary large full" type="submit" disabled data-i18n="createPrompt"></button>
          <p id="quota-note" class="small-note" role="status" data-i18n="loading"></p>
          <label class="remember-brief"><input id="remember" type="checkbox"> <span class="label-text" data-i18n="rememberBrief"></span></label>
          <p class="privacy-hint"><span data-i18n="privacyHint"></span> <button type="button" id="privacy-button" class="inline-button" data-i18n="privacyLink"></button></p>
        </form>
      </aside>
      <section class="check-panel" aria-labelledby="check-heading">
        <div class="section-heading"><h3 id="check-heading" data-i18n="checkHeading"></h3><span class="check-mascot">{{mascot}}</span></div>
        <p class="check-intro" data-i18n="checkIntro"></p>
        <label for="check-text" class="sr-only" data-i18n="checkLabel"></label><textarea id="check-text" rows="9" maxlength="20000" data-i18n-placeholder="checkPlaceholder"></textarea>
        <button id="scan-slop" class="button outlined full" type="button" disabled data-i18n="scanSlop"></button>
        <section id="slop-report" class="slop-report" hidden aria-live="polite"><h4 id="slop-title"></h4><p id="slop-note" data-i18n="slopNote"></p><ol id="slop-list"></ol><button id="fix-slop" class="button primary full" type="button" data-i18n="copyFixPrompt"></button><p id="fix-status" class="small-note" role="status" aria-live="polite"></p></section>
        <p class="check-mcp"><span data-i18n="checkMcp"></span> <a data-route="/connect" data-i18n="exploreConnect"></a></p>
      </section>
    </div>
  </section>

  <section class="inside" aria-labelledby="inside-heading">
    <div class="section-intro"><div><p class="eyebrow" data-i18n="insideEyebrow"></p><h2 id="inside-heading" class="section-title" data-i18n="insideHeading"></h2></div><p data-i18n="insideIntro"></p></div>
    <div class="inside-grid">
      <a class="inside-card reveal" data-route="/library"><span class="inside-art art-frameworks" aria-hidden="true"><i></i><i></i><i></i></span><span class="inside-number">14</span><strong data-i18n="insideFrameworks"></strong><span data-i18n="insideFrameworksText"></span><span class="inside-link" data-i18n="exploreFrameworks"></span></a>
      <a class="inside-card reveal" data-route="/people"><span class="inside-art art-people" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="inside-number">59</span><strong data-i18n="insidePeople"></strong><span data-i18n="insidePeopleText"></span><span class="inside-link" data-i18n="explorePeopleCard"></span></a>
      <a class="inside-card reveal" data-route="/connect"><span class="inside-art art-connect" aria-hidden="true"><i></i><i></i></span><span class="inside-number">MCP</span><strong data-i18n="insideConnect"></strong><span data-i18n="insideConnectText"></span><span class="inside-link" data-i18n="exploreConnect"></span></a>
    </div>
    <ul class="principles">
      <li class="reveal"><strong data-i18n="principleOneTitle"></strong><span data-i18n="principleOne"></span></li>
      <li class="reveal"><strong data-i18n="principleTwoTitle"></strong><span data-i18n="principleTwo"></span></li>
      <li class="reveal"><strong data-i18n="principleThreeTitle"></strong><span data-i18n="principleThree"></span></li>
    </ul>
  </section>
  <section class="about-name" id="om-sigge" aria-labelledby="name-heading">
    <div class="name-mascot"><p class="name-speech" data-i18n="mascotHello"></p>{{mascot}}</div>
    <div class="name-copy">
      <p class="eyebrow" data-i18n="nameEyebrow"></p><h2 id="name-heading" class="section-title" data-i18n="nameHeading"></h2>
      <p class="lead" data-i18n="nameOne"></p><p data-i18n="nameTwo"></p><p data-i18n="nameThree"></p>
      <dl class="name-facts"><div><dt data-i18n="nameFactSayTitle"></dt><dd data-i18n="nameFactSay"></dd></div><div><dt data-i18n="nameFactFromTitle"></dt><dd data-i18n="nameFactFrom"></dd></div><div><dt data-i18n="nameFactRootTitle"></dt><dd data-i18n="nameFactRoot"></dd></div></dl>
    </div>
  </section>
</main>
{{footer}}
<dialog id="prompt-dialog" aria-labelledby="prompt-title"><button class="close-dialog" type="button" data-i18n-aria-label="close">×</button><p class="eyebrow" data-i18n="promptEyebrow"></p><h2 id="prompt-title" data-i18n="promptTitle"></h2><p data-i18n="promptIntro"></p><p id="prompt-context" class="prompt-context"></p><label for="prompt-text" data-i18n="promptLabel"></label><textarea id="prompt-text" readonly rows="10"></textarea><button id="copy-prompt" class="button primary large full" type="button" data-i18n="copyPrompt"></button><p id="prompt-copy-status" class="small-note" role="status" aria-live="polite"></p><p class="small-note" data-i18n="promptNote"></p><p class="prompt-mcp"><span data-i18n="promptMcp"></span> <a data-route="/connect" data-i18n="exploreConnect"></a></p></dialog>
<dialog id="privacy-dialog" aria-labelledby="privacy-title"><button class="close-dialog" type="button" data-i18n-aria-label="close">×</button><h2 id="privacy-title" data-i18n="privacyTitle"></h2><p data-i18n="privacyOne"></p><p data-i18n="privacyTwo"></p><p data-i18n="privacyThree"></p><p data-i18n="privacyFour"></p><p><a data-route="/privacy" data-i18n="privacyFull"></a></p><button class="button primary close-privacy" type="button" data-i18n="backToDraft"></button></dialog>
</body>
</html>
