<!doctype html><html lang="{{language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title data-i18n="connectTitle"></title><meta name="description" data-i18n-content="connectDescription" content=""><meta name="robots" content="noindex"><meta property="og:video" data-i18n-content="connectVideo" content=""><meta property="og:video:type" content="video/mp4"><link rel="canonical" href="{{canonical}}"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/connect.css"><script src="/connect.js" type="module"></script></head><body><a class="skip" href="#account" data-i18n="skip"></a>
{{header}}
<main id="account" class="connect-main">
  <div id="account-notice" class="notice" role="status" aria-live="polite" hidden></div>
  <section class="connect-hero">
    <div class="connect-intro"><p class="eyebrow" data-i18n="connectEyebrow"></p><h1 class="display" data-i18n="connectHeading"></h1><p class="lead" data-i18n="connectIntro"></p>
      <ol class="connect-steps"><li data-i18n="connectStepOne"></li><li data-i18n="connectStepTwo"></li><li data-i18n="connectStepThree"></li><li data-i18n="connectStepFour"></li></ol>
    </div>
    <figure class="film film-connect" data-film data-i18n-aria-label="connectFilmLabel" role="group">
      <div class="film-stage" aria-hidden="true">
        <div class="film-scene" data-scene>
          <p class="film-caption"><b>1</b><span data-i18n="connectStepOne"></span></p>
          <div class="terminal"><div class="terminal-bar"><i></i><i></i><i></i><em>Terminal</em></div><p class="terminal-line"><span class="prompt">$</span> <span class="type">claude mcp add --transport http sigge https://sigge.si/mcp</span></p><p class="terminal-ok" data-i18n="filmServerAdded"></p><p class="terminal-line t2"><span class="prompt">&gt;</span> <span class="type">/mcp</span></p></div>
        </div>
        <div class="film-scene" data-scene>
          <p class="film-caption"><b>2</b><span data-i18n="connectStepTwo"></span></p>
          <div class="mock mock-login"><div class="mock-bar"><em>sigge.si/connect</em></div><small data-i18n="emailLabel"></small><p class="login-email"><span class="type" data-i18n="emailPlaceholder"></span></p><small data-i18n="codeLabel"></small><div class="code-boxes"><span>4</span><span>8</span><span>1</span><span>2</span><span>0</span><span>7</span></div><span class="mock-button" data-i18n="verifyCode"></span></div>
        </div>
        <div class="film-scene" data-scene>
          <p class="film-caption"><b>3</b><span data-i18n="connectStepThree"></span></p>
          <div class="mock mock-consent"><span class="consent-seal">sigge<span>.</span></span><h4 data-i18n="consentHeading"></h4><p data-i18n="filmConsentText"></p><ul><li data-i18n="filmConsentRead"></li><li data-i18n="filmConsentRevoke"></li></ul><div class="consent-row"><span class="mock-chip" data-i18n="denyConnection"></span><span class="mock-button" data-i18n="allowConnection"></span></div><p class="consent-done" data-i18n="filmConnected"></p></div>
        </div>
        <div class="film-scene" data-scene>
          <p class="film-caption"><b>4</b><span data-i18n="connectStepFour"></span></p>
          <div class="mock mock-chat"><div class="mock-bar"><i></i><i></i><i></i><em data-i18n="filmChat"></em></div><div class="bubble from-user"><span data-i18n="filmConnectAsk"></span></div><div class="tool-call"><span class="tool-dot"></span><code>sigge · search_copy_knowledge</code></div><div class="tool-call tc2"><span class="tool-dot"></span><code>sigge · get_writing_guide</code></div><div class="bubble from-ai"><strong data-i18n="filmConnectAnswer"></strong><span class="stream"><i></i><i></i><i></i></span></div></div>
        </div>
      </div>
      <div class="film-controls">
        <button class="film-toggle" type="button"><svg class="icon-pause" viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg><svg class="icon-play" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z"/></svg></button>
        <ol class="film-chapters">
          <li><button type="button" data-chapter><span class="bar"><span class="fill"></span></span><span class="label" data-i18n="connectStepOne"></span></button></li>
          <li><button type="button" data-chapter><span class="bar"><span class="fill"></span></span><span class="label" data-i18n="connectStepTwo"></span></button></li>
          <li><button type="button" data-chapter><span class="bar"><span class="fill"></span></span><span class="label" data-i18n="connectStepThree"></span></button></li>
          <li><button type="button" data-chapter><span class="bar"><span class="fill"></span></span><span class="label" data-i18n="connectStepFour"></span></button></li>
        </ol>
      </div>
    </figure>
  </section>
  <div class="connect-grid">
    <div>
      <section class="account-card">
        <div id="sign-in"><p class="card-step">1</p><h2 data-i18n="accountHeading"></h2><p data-i18n="accountIntro"></p><form id="email-form"><label for="account-email-input" data-i18n="emailLabel"></label><input id="account-email-input" type="email" name="email" required autocomplete="email" maxlength="254" data-i18n-placeholder="emailPlaceholder" placeholder=""><button id="send-code" class="button primary large full" data-i18n="sendCode"></button></form><form id="code-form" hidden><p id="code-email"></p><label for="code" data-i18n="codeLabel"></label><input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code" aria-describedby="code-help"><p id="code-help" class="connect-small" data-i18n="codeHelp"></p><label class="newsletter-label"><input id="newsletter" type="checkbox"><span data-i18n="newsletterChoice"></span></label><p class="connect-small" data-i18n="newsletterDetail"></p><button id="verify-code" class="button primary large full" data-i18n="verifyCode"></button><button id="change-email" class="text-button" type="button" data-i18n="changeEmail"></button></form></div>
        <div id="signed-in" hidden><p class="card-step is-done">✓</p><h2 data-i18n="accountReady"></h2><p id="account-email"></p><div class="account-actions"><button id="sign-out" class="button outlined" data-i18n="signOut"></button><button id="delete-account" class="text-button danger" type="button" data-i18n="deleteAccount"></button></div></div>
        <div class="account-privacy connect-small"><p data-i18n="accountPrivacy"></p><p><a data-route="/privacy" data-i18n="privacyFull"></a></p></div>
      </section>
      <section id="newsletter-account" class="account-card" hidden><h2>AC0 Field Notes</h2><p id="notes-state"></p><button id="notes-join" class="button outlined" data-i18n="notesJoin"></button><p><a href="https://www.ac0.ai/en/field-notes" target="_blank" rel="noopener noreferrer" data-i18n="fieldNotesLink"></a></p></section>
      <section id="connections" class="account-card" hidden><h2 data-i18n="connectionsTitle"></h2><p id="no-connections" data-i18n="noConnections"></p><ul id="connection-list" class="connection-list"></ul></section>
    </div>
    <div>
      <section class="client-card"><p class="card-step">2</p><h2>Claude Code</h2><p data-i18n="claudeInstructions"></p><code id="claude-command">claude mcp add --transport http --scope user sigge https://sigge.si/mcp</code><button id="copy-command" class="button outlined" data-i18n="copyCommand"></button></section>
      <section class="client-card"><p class="card-step">2</p><h2>ChatGPT</h2><p data-i18n="chatgptInstructions"></p><code id="mcp-url">https://sigge.si/mcp</code><div class="client-actions"><button id="copy-mcp" class="button outlined" data-i18n="copyAddress"></button><a class="button subtle" href="https://chatgpt.com/plugins" target="_blank" rel="noopener noreferrer" data-i18n="openPlugins"></a></div></section>
      <div class="connect-example"><h2 data-i18n="firstPromptTitle"></h2><p class="first-prompt" data-i18n="firstPrompt"></p><p class="connect-small" data-i18n="ownAI"></p></div>
    </div>
  </div>
</main>
{{footer}}
</body></html>
